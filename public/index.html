<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Pro - System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { direction: rtl; text-align: right; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    input, textarea, select { direction: ltr; text-align: left; }
    .sidebar-item.active { @apply bg-blue-100 border-r-4 border-blue-600 text-blue-900 font-bold; }
    .sidebar-item { @apply transition-all duration-200 hover:bg-blue-500; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app"></div>

  <script type="module">
    const API_URL = window.location.origin + '/api';
    let token = localStorage.getItem('token');
    let currentView = token ? 'dashboard' : 'login';

    let customers = [];
    let pipelines = [];
    let tasks = [];
    let activities = [];
    let apiKeys = [];
    let webhooks = [];

    async function apiCall(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(token && { 'Authorization': `Bearer ${token}` }),
        ...options.headers
      };

      const response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'שגיאה');
      }
      return response.json();
    }

    async function login(email, password) {
      try {
        const data = await apiCall('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        token = data.token;
        localStorage.setItem('token', token);
        currentView = 'dashboard';
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function logout() {
      token = null;
      localStorage.removeItem('token');
      currentView = 'login';
      render();
    }

    async function loadData() {
      try {
        const [cRes, pRes, tRes, aRes, wRes, kRes] = await Promise.all([
          apiCall('/customers'),
          apiCall('/pipelines'),
          apiCall('/tasks'),
          apiCall('/activity'),
          apiCall('/webhooks'),
          apiCall('/api-keys')
        ]);
        customers = cRes.data || [];
        pipelines = pRes.data || [];
        tasks = tRes.data || [];
        activities = aRes.data || [];
        webhooks = wRes.data || [];
        apiKeys = kRes.data || [];
      } catch (error) {
        console.error('Error loading data:', error);
      }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-purple-600 p-4">
          <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
            <h1 class="text-4xl font-bold text-center text-gray-800 mb-2">🚀 CRM Pro</h1>
            <p class="text-center text-gray-600 mb-8">מערכת ניהול לקוחות מקצועית</p>
            <form id="loginForm" class="space-y-4">
              <input type="email" id="email" value="admin@test.com" placeholder="דוא״ל" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              <input type="password" id="password" value="password" placeholder="סיסמה" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-3 rounded-lg hover:shadow-lg">התחבר</button>
            </form>
          </div>
        </div>
      `;
    }

    async function renderApp() {
      await loadData();

      return `
        <div class="flex h-screen bg-gray-50">
          <div class="w-64 bg-gradient-to-b from-blue-600 to-purple-600 text-white shadow-lg overflow-y-auto">
            <div class="p-6 border-b border-blue-500">
              <h1 class="text-2xl font-bold">🚀 CRM Pro</h1>
            </div>
            <nav class="p-4 space-y-2">
              ${['dashboard', 'customers', 'pipelines', 'tasks', 'activity', 'webhooks', 'api-keys', 'settings'].map(view => `
                <button onclick="switchView('${view}')" class="sidebar-item w-full text-right px-4 py-3 rounded-lg ${currentView === view ? 'active' : ''}">
                  ${view === 'dashboard' ? '📊 לוח בקרה' :
                    view === 'customers' ? '👥 לקוחות' :
                    view === 'pipelines' ? '🎯 Pipelines' :
                    view === 'tasks' ? '✓ משימות' :
                    view === 'activity' ? '📝 פעילות' :
                    view === 'webhooks' ? '🔗 Webhooks' :
                    view === 'api-keys' ? '🔑 API Keys' :
                    '⚙️ הגדרות'}
                </button>
              `).join('')}
            </nav>
            <div class="absolute bottom-0 w-64 p-4 border-t border-blue-500">
              <button onclick="logout()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg">התנתקות</button>
            </div>
          </div>

          <div class="flex-1 overflow-auto">
            <div class="bg-white shadow border-b border-gray-200">
              <div class="max-w-7xl mx-auto px-6 py-4">
                <h2 class="text-2xl font-bold text-gray-800" id="pageTitle">לוח בקרה</h2>
              </div>
            </div>
            <div id="content" class="max-w-7xl mx-auto px-6 py-8"></div>
          </div>
        </div>
      `;
    }

    async function renderContent() {
      const content = document.getElementById('content');

      if (currentView === 'activity') {
        document.getElementById('pageTitle').textContent = '📝 פעילות';
        content.innerHTML = `
          <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="w-full">
              <thead class="bg-gray-100">
                <tr>
                  <th class="px-6 py-4 font-bold">אירוע</th>
                  <th class="px-6 py-4 font-bold">תיאור</th>
                  <th class="px-6 py-4 font-bold">תאריך</th>
                </tr>
              </thead>
              <tbody>
                ${activities.map(a => `
                  <tr class="border-b hover:bg-gray-50">
                    <td class="px-6 py-4 font-medium">${a.event}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${a.description || '-'}</td>
                    <td class="px-6 py-4 text-sm">${new Date(a.created_at).toLocaleDateString('he-IL')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

      } else if (currentView === 'webhooks') {
        document.getElementById('pageTitle').textContent = '🔗 Webhooks';
        content.innerHTML = `
          <div class="mb-6">
            <form id="webhookForm" class="grid grid-cols-1 md:grid-cols-3 gap-2 bg-white p-6 rounded-xl shadow">
              <select id="event" class="px-4 py-2 border border-gray-300 rounded-lg">
                <option value="customer.created">customer.created</option>
                <option value="customer.updated">customer.updated</option>
                <option value="customer.stage_changed">customer.stage_changed</option>
              </select>
              <input type="url" placeholder="URL" id="webhookUrl" required class="px-4 py-2 border border-gray-300 rounded-lg">
              <button type="submit" class="bg-blue-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-blue-700">הוסף Webhook</button>
            </form>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${webhooks.map(w => `
              <div class="bg-white rounded-xl shadow p-6">
                <div class="flex justify-between items-start mb-4">
                  <div>
                    <h3 class="text-lg font-bold">${w.event}</h3>
                    <p class="text-sm text-gray-600 break-all">${w.url}</p>
                  </div>
                  <button onclick="deleteWebhook('${w.id}')" class="text-red-600 hover:text-red-800 font-medium">מחק</button>
                </div>
                <p class="text-xs text-gray-500">נוצר: ${new Date(w.created_at).toLocaleDateString('he-IL')}</p>
              </div>
            `).join('')}
          </div>
        `;

        document.getElementById('webhookForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            await apiCall('/webhooks', {
              method: 'POST',
              body: JSON.stringify({
                event: document.getElementById('event').value,
                url: document.getElementById('webhookUrl').value
              })
            });
            alert('✓ Webhook נוסף');
            await loadData();
            renderContent();
          } catch (error) {
            alert('❌ ' + error.message);
          }
        });

      } else if (currentView === 'api-keys') {
        document.getElementById('pageTitle').textContent = '🔑 API Keys';
        content.innerHTML = `
          <div class="mb-6">
            <form id="apiKeyForm" class="flex gap-2 bg-white p-6 rounded-xl shadow">
              <input type="text" placeholder="שם API Key" id="keyName" required class="flex-1 px-4 py-2 border border-gray-300 rounded-lg">
              <button type="submit" class="bg-blue-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-blue-700">צור</button>
            </form>
          </div>

          <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="w-full">
              <thead class="bg-gray-100">
                <tr>
                  <th class="px-6 py-4 font-bold">שם</th>
                  <th class="px-6 py-4 font-bold">Key Preview</th>
                  <th class="px-6 py-4 font-bold">נוצר</th>
                  <th class="px-6 py-4 font-bold">פעולות</th>
                </tr>
              </thead>
              <tbody>
                ${apiKeys.map(k => `
                  <tr class="border-b hover:bg-gray-50">
                    <td class="px-6 py-4 font-medium">${k.name}</td>
                    <td class="px-6 py-4 text-sm font-mono">${k.key_preview}</td>
                    <td class="px-6 py-4 text-sm">${new Date(k.created_at).toLocaleDateString('he-IL')}</td>
                    <td class="px-6 py-4 text-sm">
                      <button onclick="revokeApiKey('${k.id}')" class="text-red-600 hover:text-red-800">בטל</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById('apiKeyForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const result = await apiCall('/api-keys', {
              method: 'POST',
              body: JSON.stringify({ name: document.getElementById('keyName').value })
            });
            alert('✓ API Key: ' + result.key + '\n\nשמור אותו במקום בטוח!');
            await loadData();
            renderContent();
          } catch (error) {
            alert('❌ ' + error.message);
          }
        });
      }
    }

    window.switchView = async function(view) {
      currentView = view;
      render();
    };

    window.logout = logout;
    window.deleteWebhook = async function(id) {
      if (!confirm('מחק webhook?')) return;
      try {
        await apiCall(`/webhooks/${id}`, { method: 'DELETE' });
        alert('✓ Webhook נמחק');
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.revokeApiKey = async function(id) {
      if (!confirm('בטל API Key?')) return;
      try {
        await apiCall(`/api-keys/${id}`, { method: 'DELETE' });
        alert('✓ API Key בוטל');
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    async function render() {
      const app = document.getElementById('app');

      if (!token) {
        app.innerHTML = renderLogin();
        document.getElementById('loginForm').addEventListener('submit', (e) => {
          e.preventDefault();
          login(document.getElementById('email').value, document.getElementById('password').value);
        });
      } else {
        app.innerHTML = await renderApp();
        await renderContent();
      }
    }

    render();
  </script>
</body>
</html>
