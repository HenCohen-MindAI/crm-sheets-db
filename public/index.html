<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [dir="rtl"] {
      direction: rtl;
      text-align: right;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app"></div>

  <script type="module">
    const API_URL = window.location.origin + '/api';
    let token = localStorage.getItem('token');
    let currentView = token ? 'dashboard' : 'login';

    async function apiCall(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(token && { 'Authorization': `Bearer ${token}` }),
        ...options.headers
      };

      const response = await fetch(`${API_URL}${endpoint}`, {
        ...options,
        headers
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'API error');
      }

      return response.json();
    }

    async function login(email, password) {
      try {
        const data = await apiCall('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        token = data.token;
        localStorage.setItem('token', token);
        currentView = 'dashboard';
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function logout() {
      token = null;
      localStorage.removeItem('token');
      currentView = 'login';
      render();
    }

    async function loadCustomers() {
      try {
        const data = await apiCall('/customers');
        return data.data || [];
      } catch (error) {
        console.error('Failed to load customers:', error);
        return [];
      }
    }

    async function createCustomer(customerData) {
      try {
        await apiCall('/customers', {
          method: 'POST',
          body: JSON.stringify(customerData)
        });
        alert('✓ Customer created');
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-purple-600">
          <div class="bg-white rounded-lg shadow-xl p-8 w-96">
            <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">🚀 CRM Pro</h1>

            <form id="loginForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input type="email" id="email" value="admin@test.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" id="password" value="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              </div>

              <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-2 px-4 rounded-lg hover:shadow-lg transition">
                Login
              </button>
            </form>

            <p class="text-xs text-gray-500 mt-4 text-center">Demo: admin@test.com / password</p>
          </div>
        </div>
      `;
    }

    async function renderDashboard() {
      const customers = await loadCustomers();

      return `
        <div class="min-h-screen bg-gray-50">
          <!-- Header -->
          <div class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex justify-between items-center">
              <h1 class="text-3xl font-bold text-gray-900">📊 CRM Dashboard</h1>
              <button id="logoutBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">Logout</button>
            </div>
          </div>

          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
              <div class="bg-white rounded-lg shadow p-6">
                <p class="text-gray-600 text-sm">Total Customers</p>
                <p class="text-3xl font-bold text-blue-600">${customers.length}</p>
              </div>
              <div class="bg-white rounded-lg shadow p-6">
                <p class="text-gray-600 text-sm">Active Users</p>
                <p class="text-3xl font-bold text-green-600">1</p>
              </div>
              <div class="bg-white rounded-lg shadow p-6">
                <p class="text-gray-600 text-sm">Pipelines</p>
                <p class="text-3xl font-bold text-purple-600">0</p>
              </div>
              <div class="bg-white rounded-lg shadow p-6">
                <p class="text-gray-600 text-sm">Open Tasks</p>
                <p class="text-3xl font-bold text-yellow-600">0</p>
              </div>
            </div>

            <!-- Create Customer -->
            <div class="bg-white rounded-lg shadow p-6 mb-8">
              <h2 class="text-xl font-bold mb-4">Add New Customer</h2>
              <form id="customerForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="firstName" placeholder="First Name" required class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <input type="email" id="customerEmail" placeholder="Email" required class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <input type="tel" id="phone" placeholder="Phone" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <input type="text" id="company" placeholder="Company" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="col-span-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700">Add Customer</button>
              </form>
            </div>

            <!-- Customers Table -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
              <table class="w-full">
                <thead class="bg-gray-100 border-b">
                  <tr>
                    <th class="px-6 py-3 font-bold text-gray-900">Name</th>
                    <th class="px-6 py-3 font-bold text-gray-900">Email</th>
                    <th class="px-6 py-3 font-bold text-gray-900">Company</th>
                    <th class="px-6 py-3 font-bold text-gray-900">Created</th>
                  </tr>
                </thead>
                <tbody>
                  ${customers.length > 0 ? customers.map(c => `
                    <tr class="border-b hover:bg-gray-50">
                      <td class="px-6 py-4">${c.first_name} ${c.last_name}</td>
                      <td class="px-6 py-4">${c.email}</td>
                      <td class="px-6 py-4">${c.company || '-'}</td>
                      <td class="px-6 py-4 text-sm text-gray-600">${new Date(c.created_at).toLocaleDateString()}</td>
                    </tr>
                  `).join('') : `
                    <tr>
                      <td colspan="4" class="px-6 py-4 text-center text-gray-500">No customers yet</td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    async function render() {
      const app = document.getElementById('app');

      if (currentView === 'login') {
        app.innerHTML = renderLogin();
        document.getElementById('loginForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          login(email, password);
        });
      } else if (currentView === 'dashboard') {
        app.innerHTML = await renderDashboard();
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('customerForm').addEventListener('submit', (e) => {
          e.preventDefault();
          createCustomer({
            first_name: document.getElementById('firstName').value,
            email: document.getElementById('customerEmail').value,
            phone: document.getElementById('phone').value,
            company: document.getElementById('company').value
          });
        });
      }
    }

    render();
  </script>
</body>
</html>
