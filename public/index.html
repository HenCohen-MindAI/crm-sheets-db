<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM + Sheets DB</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 5px;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #666;
      margin-top: 20px;
    }

    .loading.show {
      display: block;
    }

    .dashboard {
      display: none;
    }

    .dashboard.show {
      display: block;
    }

    .dashboard-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      border-radius: 10px;
      margin-bottom: 30px;
      text-align: center;
    }

    .dashboard-header h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .dashboard-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .token-box {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
      word-break: break-all;
      font-size: 12px;
      font-family: monospace;
      max-height: 100px;
      overflow-y: auto;
      border: 1px solid #ddd;
    }

    .status {
      background: #d4edda;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
      color: #155724;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .button-group button {
      flex: 1;
    }

    button.secondary {
      background: #6c757d;
    }

    button.secondary:hover {
      box-shadow: 0 5px 20px rgba(108, 117, 125, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Form -->
    <div class="login-form">
      <div class="logo">
        <h1>🚀 CRM</h1>
        <p>Multi-tenant Database System</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" value="admin@test.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" value="password" required>
        </div>

        <button type="submit">Login</button>

        <div class="loading" id="loading">
          <p>⏳ Logging in...</p>
        </div>

        <div class="message" id="loginMessage"></div>
      </form>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
      <button class="secondary" onclick="logout()" style="margin-bottom: 20px;">← Logout</button>

      <div class="dashboard-header">
        <h2>Welcome! 👋</h2>
        <p id="userEmail"></p>
      </div>

      <div class="status">
        <strong>✅ Connected</strong><br>
        Server: <span id="serverStatus">Checking...</span>
      </div>

      <div>
        <h3 style="margin-bottom: 10px;">Your Token:</h3>
        <div class="token-box" id="tokenBox"></div>
      </div>

      <div class="button-group">
        <button onclick="checkHealth()">Check Health</button>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>

      <div id="healthMessage" class="message" style="margin-top: 20px;"></div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    let token = localStorage.getItem('token');

    // Load dashboard if token exists
    window.addEventListener('load', () => {
      if (token) {
        showDashboard(token);
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loading = document.getElementById('loading');
      const message = document.getElementById('loginMessage');

      loading.classList.add('show');
      message.classList.remove('success', 'error');

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          token = data.token;
          localStorage.setItem('token', token);
          showDashboard(token);
          message.innerHTML = '✅ Login successful!';
          message.classList.add('success');
        } else {
          message.innerHTML = `❌ ${data.error || 'Login failed'}`;
          message.classList.add('error');
        }
      } catch (error) {
        message.innerHTML = `❌ Error: ${error.message}`;
        message.classList.add('error');
      } finally {
        loading.classList.remove('show');
      }
    });

    function showDashboard(userToken) {
      document.querySelector('.login-form').style.display = 'none';
      document.getElementById('dashboard').classList.add('show');
      document.getElementById('tokenBox').textContent = userToken;
      document.getElementById('userEmail').textContent = 'admin@test.com';
      checkHealth();
    }

    async function checkHealth() {
      const message = document.getElementById('healthMessage');
      const status = document.getElementById('serverStatus');

      try {
        const response = await fetch(`${API_URL}/health`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();

        if (response.ok) {
          status.textContent = `✅ Running (Tenant: ${data.tenant})`;
          message.innerHTML = `✅ Server is healthy!`;
          message.classList.add('success');
          message.classList.remove('error');
        } else {
          message.innerHTML = `❌ ${data.error}`;
          message.classList.add('error');
          message.classList.remove('success');
        }
      } catch (error) {
        message.innerHTML = `❌ Error: ${error.message}`;
        message.classList.add('error');
        message.classList.remove('success');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      token = null;
      document.querySelector('.login-form').style.display = 'block';
      document.getElementById('dashboard').classList.remove('show');
      document.getElementById('email').value = 'admin@test.com';
      document.getElementById('password').value = 'password';
    }
  </script>
</body>
</html>
