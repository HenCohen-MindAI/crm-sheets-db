<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Pro - System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #5B9FFF;
      --secondary: #001F5C;
      --accent: #4A8FFF;
      --light: #F0F6FF;
    }

    * { direction: rtl; text-align: right; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    input, textarea, select { direction: ltr; text-align: left; }

    .logo-svg { width: 40px; height: 40px; }
    .sidebar-header { background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%); }
    .sidebar-item.active {
      background-color: var(--light);
      border-right: 4px solid var(--primary);
      color: var(--secondary);
      font-weight: bold;
    }
    .sidebar-item {
      transition: all 0.2s ease;
      color: white;
      margin: 4px 0;
    }
    .sidebar-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
      padding-right: 8px;
    }
    .btn-primary { background-color: var(--primary); }
    .btn-primary:hover { background-color: var(--accent); }
    .header-gradient { background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%); }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app"></div>

  <script type="module">
    const API_URL = window.location.origin + '/api';
    const ROLE_LABELS = { admin: 'מנהל מערכת', manager: 'מנהל צוות', sales_rep: 'איש מכירות', viewer: 'צפייה בלבד' };
    let token = localStorage.getItem('token');
    let currentView = token ? 'dashboard' : 'login';

    let customers = [];
    let pipelines = [];
    let stages = [];
    let tasks = [];
    let activities = [];
    let apiKeys = [];
    let webhooks = [];
    let employees = [];
    let businesses = [];
    let lastCreatedApiKey = null;
    let currentUser = JSON.parse(localStorage.getItem('user') || 'null');

    async function apiCall(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(token && { 'Authorization': `Bearer ${token}` }),
        ...options.headers
      };

      const response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'שגיאה');
      }
      return response.json();
    }

    async function login(email, password) {
      try {
        const data = await apiCall('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        token = data.token;
        currentUser = data.user;
        localStorage.setItem('token', token);
        localStorage.setItem('user', JSON.stringify(currentUser));
        localStorage.removeItem('ownerToken');
        localStorage.removeItem('ownerUser');
        localStorage.removeItem('impersonating_name');
        currentView = 'dashboard';
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function logout() {
      token = null;
      currentUser = null;
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      localStorage.removeItem('ownerToken');
      localStorage.removeItem('ownerUser');
      localStorage.removeItem('impersonating_name');
      currentView = 'login';
      render();
    }

    async function safeApiCall(endpoint) {
      try {
        return await apiCall(endpoint);
      } catch (error) {
        console.error(`Failed to load ${endpoint}:`, error.message);
        return { data: [] };
      }
    }

    async function loadData() {
      const [cRes, pRes, tRes, aRes, wRes, kRes, uRes, bRes] = await Promise.all([
        safeApiCall('/customers'),
        safeApiCall('/pipelines'),
        safeApiCall('/tasks'),
        safeApiCall('/activity'),
        safeApiCall('/webhooks'),
        safeApiCall('/api-keys'),
        safeApiCall('/users'),
        safeApiCall('/tenants')
      ]);
      customers = cRes.data || [];
      pipelines = pRes.data || [];
      tasks = tRes.data || [];
      activities = aRes.data || [];
      webhooks = wRes.data || [];
      apiKeys = kRes.data || [];
      employees = uRes.data || [];
      businesses = bRes.data || [];

      const stageResults = await Promise.all(
        pipelines.map(p => safeApiCall(`/pipelines/${p.id}/stages`))
      );
      stages = stageResults.flatMap(r => r.stages || []);
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);">
          <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
            <div class="text-center mb-8">
              <svg viewBox="0 0 160 60" class="logo-svg mx-auto mb-4" style="width: 160px; height: 60px;">
                <!-- Brain icon -->
                <g fill="#5B9FFF" opacity="0.8">
                  <path d="M30,25 Q25,15 20,15 Q10,15 10,25 Q10,35 20,40 L30,40 Z" stroke="#001F5C" stroke-width="1"/>
                  <circle cx="15" cy="22" r="2" fill="#001F5C"/>
                  <circle cx="18" cy="28" r="2" fill="#001F5C"/>
                  <circle cx="15" cy="35" r="2" fill="#001F5C"/>
                </g>
                <!-- M shape -->
                <path d="M50,45 L50,15 L60,30 L70,15 L70,45" stroke="#001F5C" stroke-width="3" fill="none" stroke-linecap="round"/>
                <!-- AI text -->
                <text x="85" y="35" font-size="24" font-weight="bold" fill="#001F5C" font-family="Arial">AI</text>
              </svg>
              <h1 class="text-3xl font-bold" style="color: var(--secondary);">MIND AI</h1>
              <p class="text-gray-600 text-sm mt-2">CRM מקצועי לניהול לקוחות ועסקים</p>
            </div>

            <form id="loginForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">דוא״ל</label>
                <input type="email" id="email" value="admin@test.com" placeholder="admin@test.com" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" style="focus-ring-color: var(--primary);">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">סיסמה</label>
                <input type="password" id="password" value="password" placeholder="סיסמה" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2" style="focus-ring-color: var(--primary);">
              </div>
              <button type="submit" class="w-full text-white font-bold py-3 rounded-lg hover:shadow-lg transition" style="background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);">התחבר</button>
            </form>

            <div class="text-center text-xs text-gray-500 mt-6">
              <p>Demo: admin@test.com / password</p>
            </div>
          </div>
        </div>
      `;
    }

    async function renderApp() {
      await loadData();

      return `
        <div class="flex h-screen bg-gray-50">
          <div class="w-64 text-white shadow-lg overflow-y-auto" style="background: linear-gradient(180deg, var(--secondary) 0%, var(--accent) 100%);">
            <div class="p-6 border-b border-blue-300 sidebar-header">
              <div class="flex items-center gap-2 justify-end mb-2">
                <h1 class="text-xl font-bold">MIND AI CRM</h1>
                <svg viewBox="0 0 40 40" class="logo-svg" style="width: 30px; height: 30px;">
                  <path d="M12,18 Q10,12 8,12 Q4,12 4,18 Q4,22 8,24 L12,24 Z" fill="var(--light)" stroke="white" stroke-width="0.5"/>
                  <circle cx="6" cy="16" r="1" fill="white"/>
                  <circle cx="7" cy="20" r="1" fill="white"/>
                </svg>
              </div>
              <p class="text-xs text-gray-200">ניהול לקוחות ועסקים</p>
            </div>
            <nav class="p-4 space-y-2">
              ${['dashboard', 'customers', 'pipelines', 'tasks', 'activity', 'webhooks', 'api-keys', 'users', 'settings'].map(view => `
                <button onclick="switchView('${view}')" class="sidebar-item w-full text-right px-4 py-3 rounded-lg ${currentView === view ? 'active' : ''}">
                  ${view === 'dashboard' ? '📊 לוח בקרה' :
                    view === 'customers' ? '👥 לקוחות' :
                    view === 'pipelines' ? '🎯 Pipelines' :
                    view === 'tasks' ? '✓ משימות' :
                    view === 'activity' ? '📝 פעילות' :
                    view === 'webhooks' ? '🔗 Webhooks' :
                    view === 'api-keys' ? '🔑 API Keys' :
                    view === 'users' ? '👤 עובדים' :
                    '⚙️ הגדרות'}
                </button>
              `).join('')}
            </nav>
            <div class="absolute bottom-0 w-64 p-4 border-t border-blue-500">
              <button onclick="logout()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg">התנתקות</button>
            </div>
          </div>

          <div class="flex-1 overflow-auto">
            ${localStorage.getItem('ownerToken') ? `
              <div class="bg-yellow-400 text-yellow-900 text-sm font-medium px-6 py-2 flex flex-wrap justify-between items-center gap-2">
                <span>🔎 אתה צופה כרגע בעסק "${localStorage.getItem('impersonating_name') || ''}" - כל פעולה תבוצע על הנתונים של העסק הזה</span>
                <button onclick="returnToOwnerAccount()" class="underline font-bold whitespace-nowrap">↩ חזרה לחשבון שלי</button>
              </div>
            ` : ''}
            <div class="bg-white shadow border-b border-gray-200">
              <div class="max-w-7xl mx-auto px-6 py-4">
                <h2 class="text-2xl font-bold text-gray-800" id="pageTitle">לוח בקרה</h2>
              </div>
            </div>
            <div id="content" class="max-w-7xl mx-auto px-6 py-8"></div>
          </div>
        </div>
      `;
    }

    async function renderContent() {
      const content = document.getElementById('content');

      if (currentView === 'dashboard') {
        document.getElementById('pageTitle').textContent = '📊 לוח בקרה';
        const activeCustomers = customers.filter(c => c.status === 'active').length;
        const thisMonth = new Date().getMonth();
        const monthCustomers = customers.filter(c => new Date(c.created_at).getMonth() === thisMonth).length;
        const taskCount = tasks.length;
        const completedTasks = tasks.filter(t => t.status === 'completed').length;

        content.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow p-6 border-r-4" style="border-color: var(--primary);">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-gray-600 text-sm">לקוחות פעילים</p>
                  <p class="text-4xl font-bold" style="color: var(--secondary);">${activeCustomers}</p>
                </div>
                <span class="text-3xl">👥</span>
              </div>
            </div>
            <div class="bg-white rounded-xl shadow p-6 border-r-4" style="border-color: var(--accent);">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-gray-600 text-sm">לקוחות חדשים החודש</p>
                  <p class="text-4xl font-bold" style="color: var(--secondary);">${monthCustomers}</p>
                </div>
                <span class="text-3xl">📈</span>
              </div>
            </div>
            <div class="bg-white rounded-xl shadow p-6 border-r-4" style="border-color: var(--primary);">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-gray-600 text-sm">משימות כללי</p>
                  <p class="text-4xl font-bold" style="color: var(--secondary);">${taskCount}</p>
                </div>
                <span class="text-3xl">✓</span>
              </div>
            </div>
            <div class="bg-white rounded-xl shadow p-6 border-r-4" style="border-color: var(--accent);">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-gray-600 text-sm">משימות שהושלמו</p>
                  <p class="text-4xl font-bold" style="color: var(--secondary);">${completedTasks}/${taskCount}</p>
                </div>
                <span class="text-3xl">✅</span>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl shadow p-6">
              <h3 class="text-lg font-bold mb-4" style="color: var(--secondary);">🔥 לקוחות אחרונים</h3>
              <div class="space-y-3">
                ${customers.slice(-5).reverse().map(c => `
                  <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                    <div>
                      <p class="font-medium">${c.first_name} ${c.last_name}</p>
                      <p class="text-sm text-gray-600">${c.email}</p>
                    </div>
                    <span class="text-xs px-3 py-1 rounded-full" style="background: var(--light); color: var(--secondary);">חדש</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="bg-white rounded-xl shadow p-6">
              <h3 class="text-lg font-bold mb-4" style="color: var(--secondary);">📋 פעילויות אחרונות</h3>
              <div class="space-y-3">
                ${activities.slice(-5).reverse().map(a => `
                  <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                    <div>
                      <p class="font-medium text-sm">${a.description || a.event}</p>
                      <p class="text-xs text-gray-600">${new Date(a.created_at).toLocaleDateString('he-IL')}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;

      } else if (currentView === 'customers') {
        document.getElementById('pageTitle').textContent = '👥 לקוחות';
        content.innerHTML = `
          <div class="mb-6">
            <form id="customerForm" class="bg-white p-6 rounded-xl shadow space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="firstName" placeholder="שם פרטי" required class="px-4 py-2 border border-gray-300 rounded-lg">
                <input type="text" id="lastName" placeholder="שם משפחה" class="px-4 py-2 border border-gray-300 rounded-lg">
                <input type="email" id="email" placeholder="דוא״ל" required class="px-4 py-2 border border-gray-300 rounded-lg">
                <input type="phone" id="phone" placeholder="טלפון" class="px-4 py-2 border border-gray-300 rounded-lg">
              </div>
              <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="company" placeholder="חברה" class="px-4 py-2 border border-gray-300 rounded-lg">
                <select id="pipeline" onchange="updateStageOptions()" class="px-4 py-2 border border-gray-300 rounded-lg">
                  <option value="">בחר Pipeline</option>
                  ${pipelines.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                </select>
                <select id="stage" class="px-4 py-2 border border-gray-300 rounded-lg">
                  <option value="">בחר שלב</option>
                </select>
                <button type="submit" class="text-white font-bold px-6 py-2 rounded-lg" style="background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);">➕ הוסף לקוח</button>
              </div>
            </form>
          </div>

          <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="w-full">
              <thead class="bg-gray-100">
                <tr>
                  <th class="px-6 py-4 font-bold" style="color: var(--secondary);">שם</th>
                  <th class="px-6 py-4 font-bold" style="color: var(--secondary);">דוא״ל</th>
                  <th class="px-6 py-4 font-bold" style="color: var(--secondary);">חברה</th>
                  <th class="px-6 py-4 font-bold" style="color: var(--secondary);">Pipeline</th>
                  <th class="px-6 py-4 font-bold" style="color: var(--secondary);">Stage</th>
                  <th class="px-6 py-4 font-bold" style="color: var(--secondary);">פעולות</th>
                </tr>
              </thead>
              <tbody>
                ${customers.filter(c => c.status !== 'deleted').map(c => {
                  const pipeline = pipelines.find(p => p.id === c.pipeline_id);
                  const stage = stages.find(s => s.id === c.stage_id);
                  return `
                    <tr class="border-b hover:bg-gray-50">
                      <td class="px-6 py-4 font-medium">${c.first_name} ${c.last_name}</td>
                      <td class="px-6 py-4 text-sm">${c.email}</td>
                      <td class="px-6 py-4 text-sm">${c.company || '-'}</td>
                      <td class="px-6 py-4 text-sm font-medium" style="color: var(--primary);">${pipeline?.name || '-'}</td>
                      <td class="px-6 py-4 text-sm">
                        ${stage ? `<span class="px-2 py-1 rounded text-white text-xs font-medium" style="background-color: ${stage.color};">${stage.name}</span>` : '-'}
                      </td>
                      <td class="px-6 py-4 text-sm">
                        <button onclick="deleteCustomer('${c.id}')" class="text-red-600 hover:text-red-800">🗑️ מחק</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;

        window.updateStageOptions = function() {
          const pipelineId = document.getElementById('pipeline').value;
          const stageSelect = document.getElementById('stage');
          const pipelineStages = stages
            .filter(s => s.pipeline_id === pipelineId)
            .sort((a, b) => a.position - b.position);

          stageSelect.innerHTML = pipelineStages.length
            ? pipelineStages.map(s => `<option value="${s.id}">${s.name}</option>`).join('')
            : `<option value="">אין שלבים - הוסף ב-Pipelines</option>`;
        };
        updateStageOptions();

        document.getElementById('customerForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            await apiCall('/customers', {
              method: 'POST',
              body: JSON.stringify({
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                company: document.getElementById('company').value,
                pipeline_id: document.getElementById('pipeline').value || null,
                stage_id: document.getElementById('stage').value || null
              })
            });
            alert('✓ לקוח נוסף');
            document.getElementById('customerForm').reset();
            updateStageOptions();
            await loadData();
            renderContent();
          } catch (error) {
            alert('❌ ' + error.message);
          }
        });

      } else if (currentView === 'pipelines') {
        document.getElementById('pageTitle').textContent = '🎯 Pipelines - Kanban Board';

        // Stages are defined manually per pipeline - nothing is auto-generated
        const stagesFor = (pipelineId) => stages
          .filter(s => s.pipeline_id === pipelineId)
          .sort((a, b) => a.position - b.position);

        content.innerHTML = `
          <div class="mb-6">
            <div class="flex gap-2 flex-wrap">
              <input type="text" id="pipelineName" placeholder="שם Pipeline חדש" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg">
              <button onclick="createNewPipeline()" class="text-white font-bold px-6 py-2 rounded-lg" style="background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);">➕ יצור Pipeline</button>
            </div>
          </div>

          ${pipelines.length === 0 ? `
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-8 text-center">
              <p class="text-gray-600 mb-4">אין עדיין Pipelines</p>
              <button onclick="document.getElementById('pipelineName').focus()" class="text-blue-600 hover:text-blue-800 font-medium">צור ראשון עכשיו →</button>
            </div>
          ` : ''}

          ${pipelines.map(p => {
            const pStages = stagesFor(p.id);
            return `
            <div class="mb-8">
              <div class="flex justify-between items-center mb-4">
                <h3 class="text-2xl font-bold" style="color: var(--secondary);">📊 ${p.name}</h3>
                <button onclick="deletePipeline('${p.id}')" class="text-red-600 hover:text-red-800 font-bold">🗑️ Delete</button>
              </div>

              ${pStages.length === 0 ? `
                <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-6 text-center mb-4">
                  <p class="text-gray-600">אין שלבים ל-Pipeline הזה עדיין. הוסף שלבים ידנית למטה ↓</p>
                </div>
              ` : `
                <div class="grid gap-4 mb-4" style="grid-template-columns: repeat(${pStages.length}, minmax(220px, 1fr));">
                  ${pStages.map(stage => `
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                      <div class="p-4 flex justify-between items-start gap-2" style="background-color: ${stage.color}; color: white;">
                        <div>
                          <h4 class="font-bold text-sm">${stage.name}</h4>
                          <p class="text-xs mt-1">${customers.filter(c => c.pipeline_id === p.id && c.stage_id === stage.id).length} לקוחות</p>
                        </div>
                        <button onclick="deleteStage('${stage.id}')" title="מחק שלב" class="text-white text-xs opacity-80 hover:opacity-100">✕</button>
                      </div>

                      <div class="p-3 min-h-96 bg-gray-50 overflow-y-auto"
                           id="stage-${p.id}-${stage.id}"
                           ondrop="handleDrop(event, '${p.id}', '${stage.id}')"
                           ondragover="handleDragOver(event)"
                           ondragleave="handleDragLeave(event)"
                           style="min-height: 400px;">

                        ${customers.filter(c => c.pipeline_id === p.id && c.stage_id === stage.id).map(c => `
                          <div class="bg-white p-3 rounded-lg shadow mb-2 cursor-move hover:shadow-md transition border-r-4"
                               style="border-color: ${stage.color};"
                               draggable="true"
                               ondragstart="handleDragStart(event, '${c.id}', '${p.id}')"
                               ondragend="handleDragEnd(event)">
                            <p class="font-medium text-sm">${c.first_name} ${c.last_name}</p>
                            <p class="text-xs text-gray-600 truncate">${c.email}</p>
                            <p class="text-xs text-gray-500 mt-1">${c.company || '-'}</p>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}

              <div class="bg-white rounded-lg shadow p-4 flex gap-2 flex-wrap items-center">
                <input type="text" placeholder="שם שלב חדש" id="newStageName-${p.id}" class="flex-1 min-w-[160px] px-3 py-2 border border-gray-300 rounded-lg text-sm">
                <input type="color" id="newStageColor-${p.id}" value="#3B82F6" class="h-10 w-14 border border-gray-300 rounded-lg cursor-pointer">
                <button onclick="createStage('${p.id}')" class="text-white font-bold px-4 py-2 rounded-lg text-sm" style="background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);">➕ הוסף שלב</button>
              </div>
            </div>
          `;
          }).join('')}
        `;

        // Attach event listeners
        window.createNewPipeline = async function() {
          const name = document.getElementById('pipelineName').value;

                          <div>
                            <span class="font-medium">${b.name}</span>
                            <span class="mr-2 px-2 py-0.5 rounded text-xs font-medium ${b.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${b.status === 'active' ? 'פעיל' : 'מושבת'}</span>
                            <span class="text-gray-500 text-xs">נוצר: ${new Date(b.created_at).toLocaleDateString('he-IL')}</span>
                          </div>
                          <div class="flex gap-3 text-sm">
                            ${b.id === currentUser.tenantId ? '<span class="text-xs text-gray-400">העסק הראשי</span>' : `
                              <button onclick="impersonateBusiness('${b.id}')" class="text-blue-600 hover:text-blue-800">👁️ כניסה לצפייה</button>
                              <button onclick="toggleBusinessStatus('${b.id}', '${b.status}')" class="${b.status === 'active' ? 'text-orange-600 hover:text-orange-800' : 'text-green-600 hover:text-green-800'}">${b.status === 'active' ? '🔒 השבת' : '🔓 הפעל'}</button>
                              <button onclick="deleteBusiness('${b.id}', '${b.name}')" class="text-red-600 hover:text-red-800">🗑️ מחק</button>
                            `}
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </div>
        `;

        document.getElementById('settingsForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const result = await apiCall('/tenants/me/spreadsheet', {
              method: 'PATCH',
              body: JSON.stringify({ spreadsheet_id: document.getElementById('spreadsheetId').value })
            });
            alert(result.sheets_ready
              ? '✓ הגדרות נשמרו, הגליונות "לידים" ו"משימות" נוצרו אוטומטית'
              : `✓ ה-ID נשמר, אך יצירת הגליונות נכשלה: ${result.sheets_error || 'לא ידוע'}`);
          } catch (error) {
            alert('❌ ' + error.message);
          }
        });

        document.getElementById('businessForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const result = await apiCall('/tenants', {
              method: 'POST',
              body: JSON.stringify({
                business_name: document.getElementById('bizName').value,
                admin_name: document.getElementById('bizAdminName').value,
                admin_email: document.getElementById('bizAdminEmail').value,
                admin_password: document.getElementById('bizAdminPassword').value
              })
            });
            alert(`✓ העסק "${result.tenant.name}" נוצר. התחבר עם ${result.admin.email} כדי לנהל אותו.`);
            await loadData();
            renderContent();
          } catch (error) {
            alert('❌ ' + error.message);
          }
        });
      }
    }

    window.switchView = async function(view) {
      currentView = view;
      render();
    };

    window.logout = logout;
    window.deleteWebhook = async function(id) {
      if (!confirm('מחק webhook?')) return;
      try {
        await apiCall(`/webhooks/${id}`, { method: 'DELETE' });
        alert('✓ Webhook נמחק');
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.viewWebhookLogs = async function(id) {
      try {
        const result = await apiCall(`/webhooks/${id}/logs`);
        if (result.data.length === 0) {
          alert('אין עדיין ניסיונות שליחה עבור Webhook זה. ודא שקרה אירוע מתאים (למשל יצירת לקוח).');
          return;
        }
        const lines = result.data.map(l =>
          `${new Date(l.created_at).toLocaleString('he-IL')} | ${l.event} | ${l.success ? '✓ הצלחה' : '✗ נכשל'} ${l.status ? `(HTTP ${l.status})` : ''} ${l.error ? '- ' + l.error : ''}`
        );
        alert('היסטוריית שליחות:\n\n' + lines.join('\n'));
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.revokeApiKey = async function(id) {
      if (!confirm('בטל API Key?')) return;
      try {
        await apiCall(`/api-keys/${id}`, { method: 'DELETE' });
        alert('✓ API Key בוטל');
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.copyApiKey = async function(key) {
      try {
        await navigator.clipboard.writeText(key);
        alert('✓ הועתק ללוח');
      } catch (error) {
        prompt('העתק ידנית (Ctrl+C):', key);
      }
    };

    window.dismissApiKeyBanner = function() {
      lastCreatedApiKey = null;
      renderContent();
    };

    window.updateUserRole = async function(id, role) {
      try {
        await apiCall(`/users/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ role })
        });
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
        await loadData();
        renderContent();
      }
    };

    window.deleteUser = async function(id) {
      if (!confirm('להסיר את העובד?')) return;
      try {
        await apiCall(`/users/${id}`, { method: 'DELETE' });
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.toggleBusinessStatus = async function(id, currentStatus) {
      const nextStatus = currentStatus === 'active' ? 'disabled' : 'active';
      const confirmMsg = nextStatus === 'disabled'
        ? 'להשבית את העסק? המשתמשים שלו לא יוכלו להתחבר או להשתמש במערכת.'
        : 'להפעיל מחדש את העסק?';
      if (!confirm(confirmMsg)) return;
      try {
        await apiCall(`/tenants/${id}/status`, {
          method: 'PATCH',
          body: JSON.stringify({ status: nextStatus })
        });
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.deleteBusiness = async function(id, name) {
      if (!confirm(`למחוק לצמיתות את העסק "${name}" וכל הנתונים שלו (לקוחות, משימות, עובדים וכו')? פעולה זו בלתי הפיכה.`)) return;
      try {
        await apiCall(`/tenants/${id}`, { method: 'DELETE' });
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.impersonateBusiness = async function(id) {
      try {
        const result = await apiCall(`/tenants/${id}/impersonate`, { method: 'POST' });

        localStorage.setItem('ownerToken', token);
        localStorage.setItem('ownerUser', JSON.stringify(currentUser));
        localStorage.setItem('impersonating_name', result.tenant.name);

        token = result.token;
        currentUser = result.user;
        localStorage.setItem('token', token);
        localStorage.setItem('user', JSON.stringify(currentUser));

        currentView = 'dashboard';
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.returnToOwnerAccount = async function() {
      const ownerToken = localStorage.getItem('ownerToken');
      const ownerUser = localStorage.getItem('ownerUser');
      if (!ownerToken) return;

      token = ownerToken;
      currentUser = JSON.parse(ownerUser);
      localStorage.setItem('token', token);
      localStorage.setItem('user', ownerUser);
      localStorage.removeItem('ownerToken');
      localStorage.removeItem('ownerUser');
      localStorage.removeItem('impersonating_name');

      currentView = 'settings';
      render();
    };

    window.deleteCustomer = async function(id) {
      if (!confirm('מחק לקוח?')) return;
      try {
        await apiCall(`/customers/${id}`, { method: 'DELETE' });
        alert('✓ לקוח נמחק');
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.deleteTask = async function(id) {
      if (!confirm('מחק משימה?')) return;
      try {
        await apiCall(`/tasks/${id}`, { method: 'DELETE' });
        alert('✓ משימה נמחקה');
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.updateTaskStatus = async function(id, status) {
      try {
        await apiCall(`/tasks/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ status })
        });
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    window.deletePipeline = async function(id) {
      if (!confirm('מחק Pipeline?')) return;
      try {
        await apiCall(`/pipelines/${id}`, { method: 'DELETE' });
        alert('✓ Pipeline נמחק');
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    };

    // Drag & Drop handlers for Kanban
    let draggedCustomerId = null;
    let draggedPipelineId = null;

    window.handleDragStart = function(e, customerId, pipelineId) {
      draggedCustomerId = customerId;
      draggedPipelineId = pipelineId;
      e.dataTransfer.effectAllowed = 'move';
      e.target.style.opacity = '0.5';
    };

    window.handleDragEnd = function(e) {
      e.target.style.opacity = '1';
    };

    window.handleDragOver = function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.target.closest('[id^="stage-"]')?.style.setProperty('background-color', '#E0E7FF', 'important');
    };

    window.handleDragLeave = function(e) {
      const stageEl = e.target.closest('[id^="stage-"]');
      if (stageEl) stageEl.style.backgroundColor = '#F9FAFB';
    };

    window.handleDrop = async function(e, pipelineId, stageId) {
      e.preventDefault();
      const stageEl = e.target.closest('[id^="stage-"]');
      if (stageEl) stageEl.style.backgroundColor = '#F9FAFB';

      if (!draggedCustomerId || draggedPipelineId !== pipelineId) {
        alert('❌ לא ניתן להעביר בין Pipelines שונים');
        return;
      }

      try {
        await apiCall(`/customers/${draggedCustomerId}`, {
          method: 'PATCH',
          body: JSON.stringify({
            stage_id: stageId,
            pipeline_id: pipelineId
          })
        });
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }

      draggedCustomerId = null;
      draggedPipelineId = null;
    };

    // Drag & Drop handlers for Task Kanban
    let draggedTaskId = null;
    let taskFilterFrom = '';
    let taskFilterTo = '';

    window.handleTaskDragStart = function(e, taskId) {
      draggedTaskId = taskId;
      e.dataTransfer.effectAllowed = 'move';
      e.target.style.opacity = '0.5';
    };

    window.handleTaskDragEnd = function(e) {
      e.target.style.opacity = '1';
    };

    window.handleTaskDragOver = function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.target.closest('[id^="task-col-"]')?.style.setProperty('background-color', '#E0E7FF', 'important');
    };

    window.handleTaskDragLeave = function(e) {
      const colEl = e.target.closest('[id^="task-col-"]');
      if (colEl) colEl.style.removeProperty('background-color');
    };

    window.handleTaskDrop = async function(e, status) {
      e.preventDefault();
      const colEl = e.target.closest('[id^="task-col-"]');
      if (colEl) colEl.style.removeProperty('background-color');

      if (!draggedTaskId) return;

      try {
        await apiCall(`/tasks/${draggedTaskId}`, {
          method: 'PATCH',
          body: JSON.stringify({ status })
        });
        await loadData();
        renderContent();
      } catch (error) {
        alert('❌ ' + error.message);
      }

      draggedTaskId = null;
    };

    window.applyTaskDateFilter = function() {
      taskFilterFrom = document.getElementById('taskFilterFrom').value;
      taskFilterTo = document.getElementById('taskFilterTo').value;
      renderContent();
    };

    window.clearTaskDateFilter = function() {
      taskFilterFrom = '';
      taskFilterTo = '';
      renderContent();
    };

    async function render() {
      const app = document.getElementById('app');

      if (!token) {
        app.innerHTML = renderLogin();
        document.getElementById('loginForm').addEventListener('submit', (e) => {
          e.preventDefault();
          login(document.getElementById('email').value, document.getElementById('password').value);
        });
      } else {
        app.innerHTML = await renderApp();
        await renderContent();
      }
    }

    render();
  </script>
</body>
</html>
