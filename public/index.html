<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { direction: rtl; text-align: right; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    input, textarea, select { direction: ltr; text-align: left; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app"></div>

  <script type="module">
    const API_URL = window.location.origin + '/api';
    let token = localStorage.getItem('token');
    let currentView = token ? 'dashboard' : 'login';
    let customers = [];
    let pipelines = [];
    let stages = {};

    async function apiCall(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(token && { 'Authorization': `Bearer ${token}` }),
        ...options.headers
      };

      const response = await fetch(`${API_URL}${endpoint}`, {
        ...options,
        headers
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'שגיאה בAPI');
      }

      return response.json();
    }

    async function login(email, password) {
      try {
        const data = await apiCall('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        token = data.token;
        localStorage.setItem('token', token);
        currentView = 'dashboard';
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function logout() {
      token = null;
      localStorage.removeItem('token');
      currentView = 'login';
      render();
    }

    async function loadData() {
      try {
        const customersData = await apiCall('/customers');
        customers = customersData.data || [];
      } catch (error) {
        console.error('שגיאה בטעינת לקוחות:', error);
      }
    }

    async function createCustomer(customerData) {
      try {
        await apiCall('/customers', {
          method: 'POST',
          body: JSON.stringify(customerData)
        });
        alert('✓ הלקוח נוסף בהצלחה');
        await loadData();
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function deleteCustomer(customerId) {
      if (!confirm('האם אתה בטוח שברצונך למחוק את הלקוח?')) return;

      try {
        await apiCall(`/customers/${customerId}`, { method: 'DELETE' });
        alert('✓ הלקוח נמחק');
        await loadData();
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-purple-600 p-4">
          <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
            <div class="text-center mb-8">
              <h1 class="text-4xl font-bold text-gray-800">🚀 CRM Pro</h1>
              <p class="text-gray-600 mt-2">מערכת ניהול לקוחות מקצועית</p>
            </div>

            <form id="loginForm" class="space-y-4">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">דוא״ל</label>
                <input type="email" id="email" value="admin@test.com" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
              </div>

              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">סיסמה</label>
                <input type="password" id="password" value="password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
              </div>

              <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:shadow-lg transition transform hover:scale-105">
                התחבר
              </button>
            </form>

            <div class="mt-6 p-4 bg-blue-50 rounded-lg text-sm text-gray-600 border border-blue-200">
              <p><strong>🔐 Demo:</strong></p>
              <p>דוא״ל: admin@test.com</p>
              <p>סיסמה: password</p>
            </div>
          </div>
        </div>
      `;
    }

    async function renderDashboard() {
      await loadData();

      return `
        <div class="min-h-screen bg-gray-50">
          <!-- Header -->
          <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex justify-between items-center">
              <h1 class="text-3xl font-bold">📊 לוח בקרה</h1>
              <button id="logoutBtn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 font-bold transition">התנתקות</button>
            </div>
          </div>

          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
              <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
                <p class="text-gray-600 text-sm font-medium">סך הלקוחות</p>
                <p class="text-3xl font-bold text-blue-600 mt-2">${customers.length}</p>
              </div>
              <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
                <p class="text-gray-600 text-sm font-medium">משתמשים פעילים</p>
                <p class="text-3xl font-bold text-green-600 mt-2">1</p>
              </div>
              <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
                <p class="text-gray-600 text-sm font-medium">pipeline</p>
                <p class="text-3xl font-bold text-purple-600 mt-2">0</p>
              </div>
              <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
                <p class="text-gray-600 text-sm font-medium">משימות פתוחות</p>
                <p class="text-3xl font-bold text-yellow-600 mt-2">0</p>
              </div>
            </div>

            <!-- Create Customer -->
            <div class="bg-white rounded-xl shadow p-6 mb-8">
              <h2 class="text-2xl font-bold mb-6 text-gray-800">➕ הוסף לקוח חדש</h2>
              <form id="customerForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="firstName" placeholder="שם פרטי" required class="px-4 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <input type="email" id="customerEmail" placeholder="דוא״ל" required class="px-4 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <input type="tel" id="phone" placeholder="טלפון" class="px-4 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <input type="text" id="company" placeholder="חברה" class="px-4 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <button type="submit" class="col-span-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition">הוסף לקוח</button>
              </form>
            </div>

            <!-- Customers Table -->
            <div class="bg-white rounded-xl shadow overflow-hidden">
              <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-xl font-bold text-gray-800">👥 רשימת לקוחות</h3>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full">
                  <thead class="bg-gray-100 border-b">
                    <tr>
                      <th class="px-6 py-4 font-bold text-gray-900">שם</th>
                      <th class="px-6 py-4 font-bold text-gray-900">דוא״ל</th>
                      <th class="px-6 py-4 font-bold text-gray-900">טלפון</th>
                      <th class="px-6 py-4 font-bold text-gray-900">חברה</th>
                      <th class="px-6 py-4 font-bold text-gray-900">תאריך</th>
                      <th class="px-6 py-4 font-bold text-gray-900">פעולות</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${customers.length > 0 ? customers.map(c => `
                      <tr class="border-b hover:bg-gray-50 transition">
                        <td class="px-6 py-4 font-medium">${c.first_name} ${c.last_name || ''}</td>
                        <td class="px-6 py-4 text-sm">${c.email}</td>
                        <td class="px-6 py-4 text-sm">${c.phone || '-'}</td>
                        <td class="px-6 py-4 text-sm">${c.company || '-'}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${new Date(c.created_at).toLocaleDateString('he-IL')}</td>
                        <td class="px-6 py-4">
                          <button onclick="deleteCustomer('${c.id}')" class="text-red-600 hover:text-red-800 font-medium text-sm">מחק</button>
                        </td>
                      </tr>
                    `).join('') : `
                      <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-gray-500">אין לקוחות עדיין</td>
                      </tr>
                    `}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function render() {
      const app = document.getElementById('app');

      if (currentView === 'login') {
        app.innerHTML = renderLogin();
        document.getElementById('loginForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          login(email, password);
        });
      } else if (currentView === 'dashboard') {
        app.innerHTML = await renderDashboard();
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('customerForm').addEventListener('submit', (e) => {
          e.preventDefault();
          createCustomer({
            first_name: document.getElementById('firstName').value,
            email: document.getElementById('customerEmail').value,
            phone: document.getElementById('phone').value,
            company: document.getElementById('company').value
          });
          document.getElementById('customerForm').reset();
        });
      }
    }

    window.deleteCustomer = deleteCustomer;
    render();
  </script>
</body>
</html>
