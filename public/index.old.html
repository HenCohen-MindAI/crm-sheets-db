<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { direction: rtl; text-align: right; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    input, textarea, select { direction: ltr; text-align: left; }
    .sidebar-item.active { @apply bg-blue-100 border-r-4 border-blue-600; }
    .sidebar-item { @apply transition-all duration-200; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app"></div>

  <script type="module">
    const API_URL = window.location.origin + '/api';
    let token = localStorage.getItem('token');
    let currentView = token ? 'dashboard' : 'login';
    let selectedCustomerId = null;

    // Data
    let customers = [];
    let pipelines = [];
    let tasks = [];
    let notes = {};

    async function apiCall(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(token && { 'Authorization': `Bearer ${token}` }),
        ...options.headers
      };

      const response = await fetch(`${API_URL}${endpoint}`, {
        ...options,
        headers
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'שגיאה בAPI');
      }

      return response.json();
    }

    async function login(email, password) {
      try {
        const data = await apiCall('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        token = data.token;
        localStorage.setItem('token', token);
        currentView = 'dashboard';
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function logout() {
      token = null;
      localStorage.removeItem('token');
      currentView = 'login';
      render();
    }

    async function loadData() {
      try {
        const [customersRes, pipelinesRes, tasksRes] = await Promise.all([
          apiCall('/customers'),
          apiCall('/pipelines'),
          apiCall('/tasks')
        ]);
        customers = customersRes.data || [];
        pipelines = pipelinesRes.data || [];
        tasks = tasksRes.data || [];
      } catch (error) {
        console.error('שגיאה בטעינת נתונים:', error);
      }
    }

    async function createCustomer(data) {
      try {
        await apiCall('/customers', { method: 'POST', body: JSON.stringify(data) });
        alert('✓ הלקוח נוסף בהצלחה');
        await loadData();
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function updateCustomer(id, data) {
      try {
        await apiCall(`/customers/${id}`, { method: 'PATCH', body: JSON.stringify(data) });
        alert('✓ הלקוח עודכן');
        await loadData();
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function deleteCustomer(id) {
      if (!confirm('האם אתה בטוח?')) return;
      try {
        await apiCall(`/customers/${id}`, { method: 'DELETE' });
        alert('✓ הלקוח נמחק');
        await loadData();
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function createPipeline(name) {
      try {
        await apiCall('/pipelines', { method: 'POST', body: JSON.stringify({ name }) });
        alert('✓ Pipeline נוסף');
        await loadData();
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function createTask(data) {
      try {
        await apiCall('/tasks', { method: 'POST', body: JSON.stringify(data) });
        alert('✓ משימה נוספה');
        await loadData();
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    async function addNote(customerId, content) {
      try {
        await apiCall('/notes', { method: 'POST', body: JSON.stringify({ customer_id: customerId, content }) });
        alert('✓ הערה נוספה');
        await loadData();
        render();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-purple-600 p-4">
          <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
            <div class="text-center mb-8">
              <h1 class="text-4xl font-bold text-gray-800">🚀 CRM Pro</h1>
              <p class="text-gray-600 mt-2">מערכת ניהול לקוחות מקצועית</p>
            </div>

            <form id="loginForm" class="space-y-4">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">דוא״ל</label>
                <input type="email" id="email" value="admin@test.com" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">סיסמה</label>
                <input type="password" id="password" value="password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>
              <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transition">התחבר</button>
            </form>

            <div class="mt-6 p-4 bg-blue-50 rounded-lg text-sm text-gray-600 border border-blue-200">
              <p><strong>🔐 Demo:</strong> admin@test.com / password</p>
            </div>
          </div>
        </div>
      `;
    }

    async function renderApp() {
      await loadData();

      return `
        <div class="flex h-screen bg-gray-50">
          <!-- Sidebar -->
          <div class="w-64 bg-gradient-to-b from-blue-600 to-purple-600 text-white shadow-lg overflow-y-auto">
            <div class="p-6 border-b border-blue-500">
              <h1 class="text-2xl font-bold">🚀 CRM Pro</h1>
              <p class="text-blue-200 text-sm mt-1">מערכת ניהול לקוחות</p>
            </div>

            <nav class="p-4 space-y-2">
              <button onclick="switchView('dashboard')" class="sidebar-item w-full text-right px-4 py-3 rounded-lg hover:bg-blue-500 transition ${currentView === 'dashboard' ? 'active' : ''}">
                📊 לוח בקרה
              </button>
              <button onclick="switchView('customers')" class="sidebar-item w-full text-right px-4 py-3 rounded-lg hover:bg-blue-500 transition ${currentView === 'customers' ? 'active' : ''}">
                👥 לקוחות
              </button>
              <button onclick="switchView('pipelines')" class="sidebar-item w-full text-right px-4 py-3 rounded-lg hover:bg-blue-500 transition ${currentView === 'pipelines' ? 'active' : ''}">
                🎯 Pipelines
              </button>
              <button onclick="switchView('tasks')" class="sidebar-item w-full text-right px-4 py-3 rounded-lg hover:bg-blue-500 transition ${currentView === 'tasks' ? 'active' : ''}">
                ✓ משימות
              </button>
              <button onclick="switchView('settings')" class="sidebar-item w-full text-right px-4 py-3 rounded-lg hover:bg-blue-500 transition ${currentView === 'settings' ? 'active' : ''}">
                ⚙️ הגדרות
              </button>
            </nav>

            <div class="absolute bottom-0 w-64 p-4 border-t border-blue-500">
              <button onclick="logout()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg transition">
                התנתקות
              </button>
            </div>
          </div>

          <!-- Main Content -->
          <div class="flex-1 overflow-auto">
            <div class="bg-white shadow border-b border-gray-200">
              <div class="max-w-7xl mx-auto px-6 py-4">
                <h2 class="text-2xl font-bold text-gray-800" id="pageTitle">לוח בקרה</h2>
              </div>
            </div>

            <div id="content" class="max-w-7xl mx-auto px-6 py-8">
              <!-- Content will be inserted here -->
            </div>
          </div>
        </div>
      `;
    }

    window.switchView = async function(view) {
      currentView = view;
      render();
    };

    window.logout = logout;
    window.deleteCustomer = deleteCustomer;
    window.addNote = addNote;

    async function renderContent() {
      const content = document.getElementById('content');

      if (currentView === 'dashboard') {
        document.getElementById('pageTitle').textContent = '📊 לוח בקרה';
        content.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow p-6">
              <p class="text-gray-600 text-sm">סך הלקוחות</p>
              <p class="text-3xl font-bold text-blue-600 mt-2">${customers.length}</p>
            </div>
            <div class="bg-white rounded-xl shadow p-6">
              <p class="text-gray-600 text-sm">Pipelines</p>
              <p class="text-3xl font-bold text-purple-600 mt-2">${pipelines.length}</p>
            </div>
            <div class="bg-white rounded-xl shadow p-6">
              <p class="text-gray-600 text-sm">משימות פתוחות</p>
              <p class="text-3xl font-bold text-yellow-600 mt-2">${tasks.filter(t => t.status === 'open').length}</p>
            </div>
            <div class="bg-white rounded-xl shadow p-6">
              <p class="text-gray-600 text-sm">משימות הושלמו</p>
              <p class="text-3xl font-bold text-green-600 mt-2">${tasks.filter(t => t.status === 'completed').length}</p>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white rounded-xl shadow p-6">
              <h3 class="text-xl font-bold mb-4">אחרונים לקוחות</h3>
              <div class="space-y-3">
                ${customers.slice(0, 5).map(c => `
                  <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                    <div>
                      <p class="font-semibold">${c.first_name} ${c.last_name || ''}</p>
                      <p class="text-sm text-gray-600">${c.email}</p>
                    </div>
                  </div>
                `).join('') || '<p class="text-gray-500">אין לקוחות</p>'}
              </div>
            </div>

            <div class="bg-white rounded-xl shadow p-6">
              <h3 class="text-xl font-bold mb-4">משימות חדשות</h3>
              <div class="space-y-3">
                ${tasks.slice(0, 5).map(t => `
                  <div class="p-3 bg-gray-50 rounded-lg">
                    <p class="font-semibold">${t.title}</p>
                    <p class="text-sm text-gray-600">עדיפות: ${t.priority}</p>
                  </div>
                `).join('') || '<p class="text-gray-500">אין משימות</p>'}
              </div>
            </div>
          </div>
        `;

      } else if (currentView === 'customers') {
        document.getElementById('pageTitle').textContent = '👥 לקוחות';
        content.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Add Customer Form -->
            <div class="lg:col-span-1">
              <div class="bg-white rounded-xl shadow p-6 sticky top-8">
                <h3 class="text-xl font-bold mb-4">➕ לקוח חדש</h3>
                <form id="customerForm" class="space-y-3">
                  <input type="text" placeholder="שם פרטי" id="firstName" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                  <input type="email" placeholder="דוא״ל" id="customerEmail" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                  <input type="tel" placeholder="טלפון" id="phone" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                  <input type="text" placeholder="חברה" id="company" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                  <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700">הוסף</button>
                </form>
              </div>
            </div>

            <!-- Customers List -->
            <div class="lg:col-span-2">
              <div class="bg-white rounded-xl shadow overflow-hidden">
                <table class="w-full">
                  <thead class="bg-gray-100 border-b">
                    <tr>
                      <th class="px-6 py-4 font-bold">שם</th>
                      <th class="px-6 py-4 font-bold">דוא״ל</th>
                      <th class="px-6 py-4 font-bold">טלפון</th>
                      <th class="px-6 py-4 font-bold">פעולות</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${customers.map(c => `
                      <tr class="border-b hover:bg-gray-50">
                        <td class="px-6 py-4 font-medium cursor-pointer hover:text-blue-600" onclick="switchView('customer'); selectedCustomerId='${c.id}'">${c.first_name}</td>
                        <td class="px-6 py-4 text-sm">${c.email}</td>
                        <td class="px-6 py-4 text-sm">${c.phone || '-'}</td>
                        <td class="px-6 py-4 text-sm">
                          <button onclick="deleteCustomer('${c.id}')" class="text-red-600 hover:text-red-800">מחק</button>
                        </td>
                      </tr>
                    `).join('') || '<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">אין לקוחות</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;

        document.getElementById('customerForm')?.addEventListener('submit', (e) => {
          e.preventDefault();
          createCustomer({
            first_name: document.getElementById('firstName').value,
            email: document.getElementById('customerEmail').value,
            phone: document.getElementById('phone').value,
            company: document.getElementById('company').value
          });
        });

      } else if (currentView === 'pipelines') {
        document.getElementById('pageTitle').textContent = '🎯 Pipelines';
        content.innerHTML = `
          <div class="mb-6">
            <form id="pipelineForm" class="flex gap-2">
              <input type="text" placeholder="שם Pipeline חדש" id="pipelineName" required class="flex-1 px-4 py-2 border border-gray-300 rounded-lg">
              <button type="submit" class="bg-blue-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-blue-700">הוסף Pipeline</button>
            </form>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${pipelines.length > 0 ? pipelines.map(p => `
              <div class="bg-white rounded-xl shadow p-6">
                <h3 class="text-xl font-bold mb-4">${p.name}</h3>
                <p class="text-gray-600 text-sm mb-4">${p.description || 'ללא תיאור'}</p>
                <div class="text-sm text-gray-500">
                  <p>נוצר: ${new Date(p.created_at).toLocaleDateString('he-IL')}</p>
                </div>
              </div>
            `).join('') : '<p class="text-gray-500">אין pipelines</p>'}
          </div>
        `;

        document.getElementById('pipelineForm')?.addEventListener('submit', (e) => {
          e.preventDefault();
          createPipeline(document.getElementById('pipelineName').value);
        });

      } else if (currentView === 'tasks') {
        document.getElementById('pageTitle').textContent = '✓ משימות';
        content.innerHTML = `
          <div class="mb-6">
            <form id="taskForm" class="grid grid-cols-1 md:grid-cols-4 gap-2">
              <input type="text" placeholder="כותרת משימה" id="taskTitle" required class="px-4 py-2 border border-gray-300 rounded-lg">
              <select id="priority" class="px-4 py-2 border border-gray-300 rounded-lg">
                <option value="low">נמוכה</option>
                <option value="medium" selected>בינונית</option>
                <option value="high">גבוהה</option>
              </select>
              <button type="submit" class="bg-blue-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-blue-700">הוסף משימה</button>
            </form>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Open -->
            <div class="bg-white rounded-xl shadow p-6">
              <h3 class="text-lg font-bold mb-4 text-yellow-600">פתוחות (${tasks.filter(t => t.status === 'open').length})</h3>
              <div class="space-y-3">
                ${tasks.filter(t => t.status === 'open').map(t => `
                  <div class="p-4 bg-yellow-50 rounded-lg border border-yellow-200">
                    <p class="font-semibold">${t.title}</p>
                    <p class="text-xs text-gray-600 mt-1">עדיפות: ${t.priority}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- In Progress -->
            <div class="bg-white rounded-xl shadow p-6">
              <h3 class="text-lg font-bold mb-4 text-blue-600">בתהליך (${tasks.filter(t => t.status === 'in_progress').length})</h3>
              <div class="space-y-3">
                ${tasks.filter(t => t.status === 'in_progress').map(t => `
                  <div class="p-4 bg-blue-50 rounded-lg border border-blue-200">
                    <p class="font-semibold">${t.title}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Completed -->
            <div class="bg-white rounded-xl shadow p-6">
              <h3 class="text-lg font-bold mb-4 text-green-600">הושלמו (${tasks.filter(t => t.status === 'completed').length})</h3>
              <div class="space-y-3">
                ${tasks.filter(t => t.status === 'completed').map(t => `
                  <div class="p-4 bg-green-50 rounded-lg border border-green-200">
                    <p class="font-semibold line-through">${t.title}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;

        document.getElementById('taskForm')?.addEventListener('submit', (e) => {
          e.preventDefault();
          createTask({
            title: document.getElementById('taskTitle').value,
            priority: document.getElementById('priority').value
          });
        });

      } else if (currentView === 'settings') {
        document.getElementById('pageTitle').textContent = '⚙️ הגדרות';
        content.innerHTML = `
          <div class="bg-white rounded-xl shadow p-8 max-w-2xl">
            <h3 class="text-2xl font-bold mb-6">הגדרות חשבון</h3>

            <div class="space-y-6">
              <div class="pb-6 border-b border-gray-200">
                <h4 class="text-lg font-bold mb-2">חיבור Google Sheets</h4>
                <p class="text-gray-600 mb-4">חבר את Google Sheets שלך כדי לשמור את הנתונים</p>
                <button class="bg-blue-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-blue-700">חבר Google</button>
              </div>

              <div class="pb-6 border-b border-gray-200">
                <h4 class="text-lg font-bold mb-2">API Keys</h4>
                <p class="text-gray-600 mb-4">צור API keys לשילוב Activepieces</p>
                <button class="bg-blue-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-blue-700">צור API Key</button>
              </div>

              <div class="pb-6 border-b border-gray-200">
                <h4 class="text-lg font-bold mb-2">משתמשים</h4>
                <p class="text-gray-600 mb-4">נהל משתמשים והרשאות</p>
                <button class="bg-blue-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-blue-700">ניהול משתמשים</button>
              </div>

              <div>
                <h4 class="text-lg font-bold mb-2">אודות</h4>
                <p class="text-gray-600">CRM Pro v1.0</p>
              </div>
            </div>
          </div>
        `;
      }
    }

    async function render() {
      const app = document.getElementById('app');

      if (!token) {
        app.innerHTML = renderLogin();
        document.getElementById('loginForm').addEventListener('submit', (e) => {
          e.preventDefault();
          login(document.getElementById('email').value, document.getElementById('password').value);
        });
      } else {
        app.innerHTML = await renderApp();
        await renderContent();
      }
    }

    render();
  </script>
</body>
</html>
